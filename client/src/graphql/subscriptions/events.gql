subscription Events {
  events {
    __typename
    ... on CreateMessage {
      message {
        ...MessageFields
        user {
          ...UserFields
        }
        chat {
          id
        }
      }
    }
    ... on UpdateMessage {
      message {
        ...MessageFields
        user {
          ...UserFields
        }
        chat {
          id
        }
      }
    }
    ... on DeleteMessage {
      message {
        id
        chat {
          id
        }
      }
    }
    ... on AddChatParticipant {
      chatId
      participant {
        id
        isAdmin
        isMuted
        lastReadAt
        user {
          ...UserFields
        }
      }
    }
    ... on RemoveChatParticipant {
      chatId
      participant {
        id
        user {
          id
        }
      }
    }
  }
}
