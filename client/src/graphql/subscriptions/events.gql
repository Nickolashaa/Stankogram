subscription Events {
  events {
    __typename
    ... on CreateMessage {
      message {
        ...MessageFields
        user {
          ...UserFields
        }
        chat {
          id
        }
      }
    }
    ... on UpdateMessage {
      message {
        ...MessageFields
        user {
          ...UserFields
        }
        chat {
          id
        }
      }
    }
    ... on DeleteMessage {
      message {
        id
        chat {
          id
        }
      }
    }
  }
}
