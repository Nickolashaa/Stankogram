mutation CreatePrivateChat($input: PrivateChatIn!) {
  createPrivateChat(input: $input) {
    __typename
    ... on Chat {
      ...ChatFields
      participants {
        id
        isAdmin
        isMuted
        lastReadAt
        user {
          ...UserFields
        }
      }
      lastMessage {
        ...MessageFields
        user {
          ...UserFields
        }
      }
    }
    ... on InvalidInputError {
      message
    }
    ... on ObjectNotFoundError {
      message
    }
    ... on ObjectAlreadyExistsError {
      message
    }
  }
}
