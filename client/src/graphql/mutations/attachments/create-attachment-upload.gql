mutation CreateAttachmentUpload($input: AttachmentUploadIn!) {
  createAttachmentUpload(input: $input) {
    __typename
    ... on AttachmentUpload {
      attachment {
        ...AttachmentFields
      }
      uploadUrl
      thumbnailUploadUrl
    }
    ... on InvalidInputError {
      message
    }
    ... on ObjectNotFoundError {
      message
    }
  }
}
