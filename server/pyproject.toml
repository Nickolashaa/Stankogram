[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "ruff>=0.15.7",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.42.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
