[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.3",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.13.0",
    "ruff>=0.15.7",
    "sqlalchemy>=2.0.51",
    "ty>=0.0.69",
    "uvicorn>=0.42.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
